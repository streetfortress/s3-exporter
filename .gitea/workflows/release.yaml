# Release artifacts off vX.Y.Z tags: the image → the gitea container
# registry (gitea.zen.lofi/sfi/s3-exporter:X.Y.Z), then the Helm chart →
# the gitea package registry as an OCI artifact
# (oci://gitea.zen.lofi/sfi/helm-s3-exporter — NOT the image's path: the
# registry keys artifacts by name+tag regardless of type, and v1.0.0's
# chart push replaced the image), with both `version` and
# `appVersion` stamped to X.Y.Z: the chart's default image tag IS the
# image built from the same commit.
#
# Cut a release with `just tag X.Y.Z` from the repo root — it validates
# semver, refuses unless HEAD is exactly the gitea remote's main, and
# pushes the tag that triggers this workflow.
#
# The chart job waits for the image job so a published chart never
# points at a tag that does not exist yet.
name: release

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: gitea.zen.lofi

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login "${{ env.REGISTRY }}" \
              --username "${{ gitea.actor }}" \
              --password-stdin

      - name: Build and push
        env:
          TAG: ${{ gitea.ref_name }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="${{ env.REGISTRY }}/sfi/s3-exporter"
          docker build \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITEA_SHA" \
            -t "$IMAGE:$VERSION" -f Containerfile .
          docker push "$IMAGE:$VERSION"

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      # helm talks to the registry directly (no docker daemon), so the
      # step-ca trust that docker gets from the runner's certs.d mount does
      # not apply — pass the lab root CA explicitly. .gitea/step-ca-root.pem
      # is a copy of fleet/infrastructure/configs/step-ca-root.pem in the
      # deployments repo.
      - name: Package and push chart
        env:
          TAG: ${{ gitea.ref_name }}
          OWNER: ${{ gitea.repository_owner }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CA=.gitea/step-ca-root.pem
          helm registry login "$REGISTRY" --ca-file "$CA" \
              --username "${{ gitea.actor }}" --password-stdin \
              <<< "${{ secrets.REGISTRY_TOKEN }}"
          CHART=charts/helm-s3-exporter
          NAME=$(sed -n 's/^name: //p' "$CHART/Chart.yaml")
          test "$NAME" != "s3-exporter" || { echo "chart name collides with the image path"; exit 1; }
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/$NAME-$VERSION.tgz" \
              "oci://$REGISTRY/$OWNER" --ca-file "$CA"
