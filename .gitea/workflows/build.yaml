# Every push: build, vet, test, lint the chart. No artifacts — those are
# release.yaml's, off tags.
name: build

on:
  push:
    branches: ['**']

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: docker build -f Containerfile .

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3
      - run: helm lint charts/helm-s3-exporter && helm template t charts/helm-s3-exporter --set probe.enabled=true --set 'probe.targets={b/p/}' >/dev/null
