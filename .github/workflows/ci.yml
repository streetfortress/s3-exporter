# CI for the GitHub mirror: build, vet, test, lint the chart on push to
# main and on every pull request. gitea.zen.lofi/oss/s3-exporter runs the
# same checks on every branch push via .gitea/workflows/build.yaml; this
# file exists so a pull request against the mirror — the only way an
# outside contributor can send a change, per CONTRIBUTING.md — gets a
# check too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: docker build -f Containerfile .

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3
      - run: helm lint charts/s3-exporter && helm template t charts/s3-exporter --set probe.enabled=true --set 'probe.targets={b/p/}' >/dev/null
