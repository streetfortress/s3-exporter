apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3-exporter.fullname" . }}
  labels:
    {{- include "s3-exporter.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
  selector:
    {{- include "s3-exporter.selectorLabels" . | nindent 4 }}
